name: Validate project

on:
  push:
    branches:
      - feature/instagram-comment-dm
  pull_request:
    branches:
      - main

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest worker/tests -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Initialize an empty database for the production build
        working-directory: .
        run: python migrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    runs-on: ubuntu-latest
    needs: [worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build clean source archive
        run: |
          zip -r REELS-SPIDER-fixed.zip . \
            -x ".git/*" "*/node_modules/*" "*/.next/*" "*/.venv/*" \
               "*/__pycache__/*" "*.pyc" ".env" "*/.env"
      - uses: actions/upload-artifact@v4
        with:
          name: REELS-SPIDER-fixed
          path: REELS-SPIDER-fixed.zip
          if-no-files-found: error
